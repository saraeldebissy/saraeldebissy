name: Refresh telemetry panel

on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose: scheduled jobs that land on :00
    # queue behind everyone else's and get delayed.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: node .github/render/fetch-stats.mjs

      - name: Build SVG
        run: node .github/render/build-svg.mjs

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/profile.svg .github/render/stats.json
          if git diff --staged --quiet; then
            echo 'Numbers unchanged, nothing to commit.'
          else
            git commit -m 'Refresh telemetry panel with current streak data'
            git push
          fi
